<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #101827; }
  .stage {
    position: relative; width: 1024px; height: 500px;
    background:
      radial-gradient(ellipse 46% 70% at 26% 48%, rgba(200,150,65,0.10), transparent 70%),
      radial-gradient(ellipse 80% 90% at 50% 40%, #1b2840 0%, #142033 45%, #101827 100%);
    display: flex; align-items: center;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .stars { position: absolute; inset: 0; }
  .mark { position: absolute; left: 92px; top: 50px; width: 400px; height: 400px; }
  .copy { position: absolute; left: 470px; right: 80px; top: 0; bottom: 0;
          display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { color: #c89641; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase;
             font-weight: 500; margin: 0 0 18px; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; color: #f8f5ef;
       font-size: 76px; line-height: 1; margin: 0 0 26px; letter-spacing: 0.01em; }
  .tag { font-family: 'Playfair Display', Georgia, serif; font-size: 31px; line-height: 1.28;
         color: #f8f5ef; margin: 0; font-weight: 500; }
  .tag em { color: #e7c174; font-style: italic; }
  .rule { width: 56px; height: 2px; background: #c89641; margin: 0 0 24px; opacity: 0.9; }
</style>
</head>
<body>
<div class="stage">
  <svg class="stars" viewBox="0 0 1024 500" aria-hidden="true">
    <g fill="#e7c174">
      <circle cx="60" cy="70" r="1.6" opacity="0.4"/><circle cx="210" cy="36" r="1.2" opacity="0.3"/>
      <circle cx="470" cy="60" r="1.4" opacity="0.35"/><circle cx="700" cy="40" r="1.2" opacity="0.3"/>
      <circle cx="960" cy="82" r="1.8" opacity="0.4"/><circle cx="990" cy="250" r="1.2" opacity="0.3"/>
      <circle cx="930" cy="440" r="1.6" opacity="0.35"/><circle cx="640" cy="462" r="1.2" opacity="0.3"/>
      <circle cx="430" cy="440" r="1.4" opacity="0.3"/><circle cx="40" cy="400" r="1.6" opacity="0.35"/>
      <circle cx="120" cy="250" r="1.1" opacity="0.25"/><circle cx="820" cy="140" r="1.1" opacity="0.25"/>
    </g>
  </svg>

  <svg class="mark" viewBox="76 76 360 360" overflow="visible" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#f3d79a" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#e7c174" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g stroke="#c89641" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="256" y1="128" x2="160" y2="384"/>
      <line x1="256" y1="128" x2="352" y2="384"/>
      <line x1="196" y1="288" x2="316" y2="288"/>
      <line x1="196" y1="288" x2="352" y2="384" stroke-opacity="0.45" stroke-width="3.5"/>
    </g>
    <circle cx="256" cy="128" r="44" fill="url(#glow)"/>
    <g fill="#e7c174">
      <circle cx="256" cy="128" r="16"/>
      <circle cx="160" cy="384" r="12"/>
      <circle cx="352" cy="384" r="12"/>
      <circle cx="196" cy="288" r="10"/>
      <circle cx="316" cy="288" r="10"/>
    </g>
  </svg>

  <div class="copy">
    <h1>Aidoraa</h1>
    <div class="rule"></div>
    <p class="tag">Understand yourself,<br><em>and everything that shapes you.</em></p>
  </div>
</div>
</body>
</html>
