name: Rebuild Pi base snapshot

# Per-person Pi workspaces start from this snapshot. A stale one still runs the
# right code (the runtime bundle hash is checked) but reinstalls Pi and Atros
# in every new workspace, so rebuild it whenever the runtime changes. The new
# ID reaches deployments on their next build.
on:
  push:
    branches:
      - main
    paths:
      - runtime/pi/**
      - src/lib/astro/pi-runtime.ts
      - src/lib/astro/pi-initialization.ts
      - src/lib/astro/atros-commands.ts
      - scripts/build-pi-base-snapshot.mts
      - scripts/rotate-pi-base-snapshot.mjs
  workflow_dispatch:

concurrency:
  group: pi-base-snapshot
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build snapshot and set PI_BASE_SNAPSHOT_ID
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: team_t689qVHC6ycaHamXLceV4yu5
      VERCEL_PROJECT_ID: prj_T6xLcx3lfm7KjpLk4co1lCgkSMnK
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the snapshot in a Vercel Sandbox
        id: build
        run: |
          npx --yes tsx@4.20.6 scripts/build-pi-base-snapshot.mts | tee snapshot.out
          id="$(tail -n 1 snapshot.out | jq -r '.PI_BASE_SNAPSHOT_ID')"
          if [[ ! "$id" =~ ^snap_[A-Za-z0-9_-]+$ ]]; then echo "No snapshot ID in the build output." >&2; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Point Preview and Production at it and delete the one before last
        env:
          SNAPSHOT_ID: ${{ steps.build.outputs.id }}
        run: |
          set -o pipefail
          node scripts/rotate-pi-base-snapshot.mjs "$SNAPSHOT_ID" | tee -a "$GITHUB_STEP_SUMMARY"
