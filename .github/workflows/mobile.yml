name: Mobile app

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already has the Android SDK; only add what it lacks.
      - name: Install Android platform 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # No secrets: Supabase key and Google client id stay empty, so sign-in shows
      # "not set up in this build". Release signing is skipped without a keystore.
      - name: Build debug APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Shared unit tests
        run: ./gradlew --no-daemon :shared:testAndroidHostTest :androidApp:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: apps/mobile/shared/build/reports/tests/
